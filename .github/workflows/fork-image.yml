# Fork-only: build and push a patched cerberus image to this fork's GHCR
# namespace on every push to main, without the upstream release pipeline
# (goreleaser, release gates, chart publishing). The tag is
# <upstream appVersion>-<fork owner>.<short sha>, e.g. 1.22.0-ffreville.abc1234.
name: fork-image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    if: github.repository_owner != 'tsouza'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Compute version
        id: version
        run: |
          app_version="$(sed -n 's/^appVersion: *"\(.*\)"/\1/p' deploy/helm/cerberus/Chart.yaml)"
          echo "tag=${app_version}-${GITHUB_REPOSITORY_OWNER}.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build binaries
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ steps.version.outputs.tag }}
        run: |
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.Version=${VERSION}" \
              -o "dist/linux/${arch}/cerberus" ./cmd/cerberus
          done

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: dist
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cerberus:${{ steps.version.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/cerberus:main
